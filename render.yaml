services:
  - type: web
    name: usports-backend
    runtime: node
    plan: free
    root: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your_super_secret_key_12345
    autoDeploy: true
    healthCheckPath: /api/health
